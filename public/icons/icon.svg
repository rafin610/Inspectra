<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#5B4DF6" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Glass Highlights & Shadows -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Drop Shadow Filter for 3D Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.38" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Top Sheen / Edge Highlight -->
  <rect width="508" height="508" x="2" y="2" rx="110" fill="url(#glassSheen)" stroke="rgba(255, 255, 255, 0.22)" stroke-width="3" />

  <!-- Magnifying Glass with Checkmark -->
  <g filter="url(#shadow)">
    <!-- Handle -->
    <path d="M 288 288 L 388 388" 
          stroke="url(#lensGrad)" 
          stroke-width="36" 
          stroke-linecap="round" />
    
    <!-- Outer Lens Ring -->
    <circle cx="218" cy="218" r="96" 
            fill="none" 
            stroke="url(#lensGrad)" 
            stroke-width="30" />

    <!-- Lens Subtle Fill -->
    <circle cx="218" cy="218" r="81" 
            fill="rgba(255, 255, 255, 0.08)" />

    <!-- Checkmark Inside Lens -->
    <path d="M 174 218 L 206 250 L 268 186" 
          fill="none" 
          stroke="url(#lensGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Top-left Lens Glare Arc -->
  <path d="M 152 180 A 80 80 0 0 1 254 144" 
        fill="none" 
        stroke="rgba(255, 255, 255, 0.45)" 
        stroke-width="8" 
        stroke-linecap="round" />
</svg>
